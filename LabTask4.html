<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Display Section</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .product-container {
            display: block;
            text-align: center;
            white-space: nowrap; /* keeps boxes on the same line */
        }

        .product-box {
            display: inline-block;
            vertical-align: top;
            width: 260px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            white-space: normal; /* allows text wrapping inside */
        }

        .product-box:hover {
            outline: 3px solid #007bff;
            outline-offset: 5px;
        }

        .product-box img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product-box h3 {
            margin: 10px 0 5px;
            color: #333;
        }

        .product-box p {
            color: #555;
            font-size: 14px;
            margin: 5px 0 10px;
        }

        .price {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
            display: block;
        }

        .buy-now {
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .buy-now:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Our Products</h1>

    <div class="product-container">
        <div class="product-box">
            <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=400&q=80" alt="Laptop">
            <h3>Laptop</h3>
            <p>Powerful performance laptop perfect for work and gaming.</p>
            <span class="price">$999</span>
            <a href="#" class="buy-now">Buy Now</a>
        </div>

        <div class="product-box">
            <img src="https://images.unsplash.com/photo-1511367461989-f85a21fda167?auto=format&fit=crop&w=400&q=80" alt="Headphones">
            <h3>Headphones</h3>
            <p>Noise-cancelling wireless headphones with deep bass sound.</p>
            <span class="price">$199</span>
            <a href="#" class="buy-now">Buy Now</a>
        </div>

        <div class="product-box">
            <img src="https://images.unsplash.com/photo-1519744792095-2f2205e87b6f?auto=format&fit=crop&w=400&q=80" alt="Smartwatch">
            <h3>Smartwatch</h3>
            <p>Stay connected and monitor your fitness in style.</p>
            <span class="price">$249</span>
            <a href="#" class="buy-now">Buy Now</a>
        </div>
    </div>

</body>
</html>
